<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أتمّ — التزام · تطور · مهام</title>
<meta name="author" content="م. إياد حلوبي">
<meta name="theme-color" content="#0C1222">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="أتمّ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="أتمّ — مقياس شهري للمهام والتطور والالتزام. إعداد وتصميم م. إياد حلوبي.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c-tasks:#6E9BF0; --c-growth:#5CC79A; --c-commit:#E9B65A; --danger:#E8776F;
  --bg:#0C1222; --card:#151E33; --card-2:#1A2440;
  --border:rgba(255,255,255,.075); --border-2:rgba(255,255,255,.15);
  --ink:#EDE8DE; --ink-2:#B8BECB; --muted:#7D869A;
  --track:rgba(255,255,255,.075); --field:rgba(255,255,255,.04);
  --header:rgba(12,18,34,.86); --on-accent:#0C1222;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 24px 48px -30px rgba(0,0,0,.7);
  --display:'Readex Pro','IBM Plex Sans Arabic',sans-serif;
}
:root[data-theme="light"]{
  --c-tasks:#3462D2; --c-growth:#1E8C60; --c-commit:#B97E12; --danger:#CC4F47;
  --bg:#E9ECF1; --card:#FFFFFF; --card-2:#F6F7F9;
  --border:rgba(20,30,55,.075); --border-2:rgba(20,30,55,.15);
  --ink:#1C2333; --ink-2:#434B5E; --muted:#6E7689;
  --track:rgba(20,30,55,.075); --field:#F3F4F7;
  --header:rgba(237,239,243,.88); --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(20,30,55,.04), 0 10px 28px -16px rgba(20,30,55,.14);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:var(--ink); line-height:1.6;
  font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  background:var(--bg);
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  transition:background-color .4s ease,color .4s ease;
}
button,input,select{font:inherit;color:inherit}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
/* ===== الحركة المستمرة ===== */
.logo{overflow:visible;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c-growth) 25%,transparent))}
.logo .a{transform-box:view-box;transform-origin:23px 23px}
.logo .a1{animation:spin 10s linear infinite,dash1 5s ease-in-out infinite alternate;animation-delay:var(--t,0s)}
.logo .a2{animation:spinr 7s linear infinite,dash2 4s ease-in-out infinite alternate;animation-delay:var(--t,0s)}
.logo .a3{animation:spin 4.5s linear infinite,dash3 3s ease-in-out infinite alternate;animation-delay:var(--t,0s)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes dash1{from{stroke-dasharray:96 200}to{stroke-dasharray:34 200}}
@keyframes dash2{from{stroke-dasharray:26 140}to{stroke-dasharray:68 140}}
@keyframes dash3{from{stroke-dasharray:36 80}to{stroke-dasharray:12 80}}

.bar>i{position:relative;overflow:hidden}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:sheen 3.4s ease-in-out infinite;animation-delay:var(--t,0s)}
@keyframes sheen{0%{transform:translateX(110%)}55%,100%{transform:translateX(-110%)}}



.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.shell{max-width:940px;margin:0 auto;padding:0 20px}

/* ===== الترويسة ===== */
.top{position:sticky;top:0;z-index:30;background:var(--header);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--border)}
.top-row{display:flex;align-items:center;gap:14px;padding:14px 0 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:190px}
.brand h1{font-family:var(--display);font-weight:700;font-size:25px;margin:0;line-height:1}
.brand .tag{font-size:11.5px;color:var(--muted);margin-top:5px;letter-spacing:.3px}
.brand .tag b{font-weight:400}
.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);padding:0 8px 0 4px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--c-growth);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-growth) 18%,transparent)}
.status.busy .dot{background:var(--c-commit);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-commit) 18%,transparent)}
.status.err{color:var(--danger)}
.status.err .dot{background:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 18%,transparent)}
.ibtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--ink-2);font-size:12.5px;cursor:pointer;transition:all .2s ease;white-space:nowrap}
.ibtn:hover{border-color:var(--border-2);color:var(--ink)}
.ibtn.primary{color:var(--c-tasks);border-color:color-mix(in srgb,var(--c-tasks) 40%,transparent);background:color-mix(in srgb,var(--c-tasks) 10%,transparent);font-weight:600}
.ibtn.primary:hover{background:var(--c-tasks);color:var(--on-accent)}
.ibtn.armed{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 55%,transparent);background:color-mix(in srgb,var(--danger) 12%,transparent);font-weight:700}
.ibtn svg{flex:0 0 auto}
@media (max-width:700px){.ibtn .lbl{display:none}.ibtn{padding:0 10px}.ibtn.armed .lbl{display:inline}}

.months{display:flex;gap:4px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.mtab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:44px;padding:7px 10px 8px;border-radius:12px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;transition:all .2s ease}
.mtab.year{padding:7px 16px}
.mtab.has{color:var(--ink-2)}
.mtab:hover{background:var(--card);border-color:var(--border);color:var(--ink)}
.mtab .pip{width:20px;height:3px;border-radius:3px;background:var(--track);overflow:hidden;display:block}
.mtab .pip i{display:block;height:100%;border-radius:inherit}
.mtab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mtab.on .pip{background:color-mix(in srgb,var(--bg) 25%,transparent)}

/* ===== المحتوى ===== */
main{padding:28px 0 56px;display:flex;flex-direction:column;gap:22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.4px}
.h2{font-family:var(--display);font-weight:600;font-size:21px;margin:2px 0 0;line-height:1.35}
.hint{font-size:12px;color:var(--muted)}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.tri{position:relative;flex:0 0 auto}
.tri svg{display:block;transform:rotate(-90deg)}
.tri circle{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),opacity .3s}
.tri-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

.hero{padding:28px 30px;display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center}
.ring-col{display:flex;flex-direction:column;align-items:center}
.tri-c .big{font-family:var(--display);font-weight:600;line-height:1;color:var(--ink);letter-spacing:-.5px}
.tri-c .cap{font-size:11.5px;color:var(--muted);margin-top:7px;letter-spacing:.3px}
.side-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px}
.side-head .h2,.side-head .ttl{margin:0}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--g);background:color-mix(in srgb,var(--g) 12%,transparent);border:1px solid color-mix(in srgb,var(--g) 32%,transparent)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--g)}
@media (max-width:700px){.hero{grid-template-columns:1fr;justify-items:center;padding:24px 18px;gap:24px}.hero .side{width:100%}}

.stats{border-top:1px solid var(--border)}
.stat{display:grid;grid-template-columns:10px 64px 1fr 46px 108px;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}
.stat:last-child{border-bottom:none;padding-bottom:2px}
.stat .sw{width:10px;height:10px;border-radius:3px}
.stat .nm{font-size:13.5px;font-weight:600}
.stat .pc{font-size:15px;font-weight:600;text-align:left}
.stat .gr{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);justify-self:start}
.stat .gr i{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
@media (max-width:520px){.stat{grid-template-columns:10px 58px 1fr 42px}.stat .gr{display:none}}
.bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;transition:width .8s cubic-bezier(.2,.8,.2,1)}

.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.ins .card{padding:16px 18px;border-radius:18px}
.ins .k{font-size:11.5px;color:var(--muted)}
.ins .v{font-family:var(--display);font-weight:600;font-size:19px;margin-top:4px;line-height:1.3}
.ins .s{font-size:12px;color:var(--muted);margin-top:2px}

.chart{padding:22px 22px 16px}
.chart-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.mcard{padding:15px 16px;border-radius:18px;display:flex;gap:14px;align-items:center;cursor:pointer;text-align:right;color:var(--ink);transition:transform .25s ease,border-color .25s ease}
.mcard:hover{transform:translateY(-2px);border-color:var(--border-2)}
.mcard .t{font-weight:600;font-size:14.5px}
.mcard .p{font-size:20px;font-weight:600;line-height:1.2;margin-top:2px}
.mcard .g{font-size:11.5px}

.mhero .ttl{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.2;margin-top:2px}
.mnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.sel{background:var(--field);border:1px solid var(--border);border-radius:9px;padding:5px 9px;font-size:12.5px;color:var(--ink);cursor:pointer}
.sel option{color:#111;background:#fff}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.mini3>div{background:var(--field);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.mini3 .k{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.mini3 .k i{width:8px;height:8px;border-radius:2px;display:inline-block}
.mini3 .v{font-size:18px;font-weight:600;margin-top:2px}

.sq{overflow:hidden}
.sq-head{display:flex;align-items:center;gap:14px;padding:20px 22px 16px;border-bottom:1px solid var(--border)}
.sq-badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 25%,transparent)}
.sq-head h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0;line-height:1.3}
.sq-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.sq-score{margin-inline-start:auto;text-align:left;flex:0 0 auto}
.sq-score .num{font-size:26px;font-weight:600;color:var(--c);line-height:1}
.sq-score .g{font-size:11.5px;margin-top:4px}
.sq-body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:12px}
@media (max-width:560px){.sq-head{padding:16px}.sq-body{padding:14px 16px 18px}}

.item{background:var(--card-2);border:1px solid var(--border);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:11px}
.item-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.item-name{font-weight:600;font-size:14.5px}
.pill{font-size:11px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);border-radius:99px;padding:2px 10px}
.spacer{flex:1}
.pc-s{font-size:15px;font-weight:600;color:var(--c);min-width:44px;text-align:left}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 11px 7px 9px;border-radius:11px;border:1px solid var(--border);background:var(--field);font-size:13.5px;cursor:pointer;user-select:none;transition:all .18s ease}
.chip:hover{border-color:var(--border-2)}
.chip .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-2);display:grid;place-items:center;font-size:10px;font-weight:700;flex:0 0 auto}
.chip.s1{border-color:color-mix(in srgb,var(--c-commit) 45%,transparent);background:color-mix(in srgb,var(--c-commit) 9%,transparent)}
.chip.s1 .st{border-color:var(--c-commit);background:linear-gradient(90deg,var(--c-commit) 50%,transparent 50%)}
.chip.s2{border-color:color-mix(in srgb,var(--c-tasks) 45%,transparent);background:color-mix(in srgb,var(--c-tasks) 10%,transparent)}
.chip.s2 .st{border-color:var(--c-tasks);background:var(--c-tasks);color:var(--on-accent)}
.chip.s2 .tx{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent);color:var(--ink-2)}

.x{background:none;border:none;color:var(--muted);opacity:.55;cursor:pointer;font-size:16px;line-height:1;padding:0 3px;transition:all .15s}
.x:hover{color:var(--danger);opacity:1}
.confirm{background:color-mix(in srgb,var(--danger) 13%,transparent);border:1px solid color-mix(in srgb,var(--danger) 50%,transparent);color:var(--danger);border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}

.g-grid{display:flex;flex-wrap:wrap;gap:6px}
.g-cell{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--field);color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;display:grid;place-items:center;padding:0;transition:all .15s ease}
.g-cell:hover{border-color:var(--c-growth)}
.g-cell.on{background:var(--c-growth);border-color:var(--c-growth);color:var(--on-accent)}

.c-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(29px,1fr));gap:4px}
.c-cell{aspect-ratio:1;min-width:0;border-radius:7px;border:1px solid var(--border);background:var(--field);color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;display:grid;place-items:center;padding:0;transition:all .15s ease}
.c-cell:hover{border-color:var(--c-commit)}
.c-cell.on{background:var(--c-commit);border-color:var(--c-commit);color:var(--on-accent)}
.c-cell.off{background:color-mix(in srgb,var(--danger) 12%,transparent);border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger)}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid var(--border)}

.field{background:var(--field);border:1px solid var(--border);border-radius:11px;padding:9px 13px;color:var(--ink);font-size:13.5px;outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
.field::placeholder{color:var(--muted)}
.field:focus{border-color:color-mix(in srgb,var(--c,var(--c-tasks)) 60%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--c-tasks)) 15%,transparent)}
.field.n{width:68px;text-align:center;padding:9px 6px}
.tgt{width:48px;text-align:center;background:var(--field);border:1px solid var(--border);border-radius:8px;padding:3px 6px;color:var(--ink);font-size:12px;outline:none}
.btn{background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);color:var(--c);border-radius:11px;padding:9px 18px;font-weight:600;font-size:13.5px;cursor:pointer;transition:all .2s ease;white-space:nowrap}
.btn:hover{background:var(--c);color:var(--on-accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl-in{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.adder{border:1px dashed color-mix(in srgb,var(--c) 38%,transparent);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.adder-t{font-size:12.5px;font-weight:600;color:var(--c)}
.empty{color:var(--muted);font-size:13.5px;line-height:1.85;padding:14px 16px;border-radius:14px;background:var(--field);border:1px dashed var(--border-2)}
.empty-hero{text-align:center;color:var(--muted);font-size:13.5px;margin-top:14px;line-height:1.8}

footer{padding:6px 20px 40px;text-align:center}
footer .by{color:var(--muted);font-size:11px;letter-spacing:.8px}
footer .nm{font-family:var(--display);font-weight:600;font-size:15px;margin-top:2px}
footer .note{color:var(--muted);font-size:11.5px;margin-top:8px}

/* ===== اليوم والتنبيهات ===== */
.c-cell.today{border:2px solid var(--ink);color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-commit) 35%,transparent);font-weight:700}
.c-cell.today.on{color:var(--on-accent)}
.c-cell.miss{border-style:dashed;border-color:color-mix(in srgb,var(--c-commit) 60%,transparent);color:var(--ink-2)}
.c-cell.fut{opacity:.42}
.keys i.k-today{border:2px solid var(--ink);box-shadow:0 0 0 2px color-mix(in srgb,var(--c-commit) 35%,transparent)}
.keys i.k-miss{border:1px dashed var(--c-commit)}
.today-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--c-commit);background:color-mix(in srgb,var(--c-commit) 12%,transparent);border:1px solid color-mix(in srgb,var(--c-commit) 30%,transparent);border-radius:99px;padding:2px 10px;white-space:nowrap}
.notice{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-radius:18px;background:var(--card);border:1px solid color-mix(in srgb,var(--c) 32%,var(--border));box-shadow:var(--shadow)}
.notice .n-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.notice .n-tx{flex:1;min-width:200px;font-size:13.5px;line-height:1.7}
.notice .n-tx b{font-weight:600}
.notice .n-tx small{display:block;color:var(--muted);font-size:12px}
.setup{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-radius:18px}
.setup .s-t{flex:1;min-width:200px;font-size:13.5px}
.setup .s-t b{font-weight:600}
.setup .s-t small{display:block;color:var(--muted);font-size:12px}
.mcard .cal{font-size:11px;color:var(--muted)}
.mcard.cur{border-color:color-mix(in srgb,var(--c-commit) 55%,transparent)}
.ibtn.share{color:var(--c-commit);border-color:color-mix(in srgb,var(--c-commit) 40%,transparent);background:color-mix(in srgb,var(--c-commit) 10%,transparent);font-weight:600}
.ibtn.share:hover{background:var(--c-commit);color:var(--on-accent)}
.ibtn:disabled{opacity:.4;cursor:default}

/* ===== قائمة الإعدادات ===== */
.menu-wrap{position:relative}
.menu-btn{position:relative}

}

    var st = startYM(), now = new Date(), out = "";
    for (var k = -18; k <= 2; k++) {
      var d = new Date(now.getFullYear(), now.getMonth() + k, 1), y = d.getFullYear(), m = d.getMonth() + 1;
      out += '<option value="' + y + '-' + m + '"' + (st.y === y && st.m === m ? " selected" : "") + '>' + AR_MONTHS[m - 1] + ' ' + y + '</option>';

  }
  function backupDue() {
    if (!hasAnyData()) return false;

  var TODAY = ymd(new Date());
  var visitGap = meta.lastVisit ? daysBetween(meta.lastVisit, TODAY) : null;
  meta.lastVisit = TODAY;

  /* ============ عناصر مرئية ============ */
  function triRing(size, s, center) {
    var sw = Math.max(5, Math.round(size * 0.056)), gap = Math.max(2, Math.round(size * 0.022));
    var r = size / 2 - sw / 2, h = size / 2, out = "";
    ["commit", "growth", "tasks"].forEach(function (k) {
      var c = 2 * Math.PI * r, v = (s[k] === null || s[k] === undefined) ? 0 : clamp01(s[k]);
      out += '<circle cx="' + h + '" cy="' + h + '" r="' + r + '" fill="none" stroke="var(--track)" stroke-width="' + sw + '"></circle>' +
             '<circle cx="' + h + '" cy="' + h + '" r="' + r + '" fill="none" stroke="' + SQ[k].c + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + (c * (1 - v)).toFixed(2) + '" style="opacity:' + (v > 0 ? 1 : 0) + '"></circle>';
      r -= sw + gap;
    });
    return '<div class="tri" style="width:' + size + 'px;height:' + size + 'px">' +
      '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' + out + '</svg>' +
      '<div class="tri-c">' + (center || "") + '</div></div>';
  }

  function bar(v, color, h) {
    return '<div class="bar"' + (h ? ' style="height:' + h + 'px"' : '') + '><i style="width:' + (clamp01(v || 0) * 100) + '%;background:' + color + '"></i></div>';
  }

  function smoothPath(p, top, bottom) {
    if (!p.length) return "";
    var cy = function (y) { return Math.max(top, Math.min(bottom, y)).toFixed(1); };
    var d = "M" + p[0].x.toFixed(1) + "," + p[0].y.toFixed(1);
    for (var i = 0; i < p.length - 1; i++) {
      var p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
      d += " C" + (p1.x + (p2.x - p0.x) / 6).toFixed(1) + "," + cy(p1.y + (p2.y - p0.y) / 6) +
           " " + (p2.x - (p3.x - p1.x) / 6).toFixed(1) + "," + cy(p2.y - (p3.y - p1.y) / 6) +
           " " + p2.x.toFixed(1) + "," + p2.y.toFixed(1);
    }
    return d;
  }

  function trendChart() {
    var W = 760, H = 240, Pt = 14, Pb = 30, Pl = 40, Pr = 14;
    var iw = W - Pl - Pr, ih = H - Pt - Pb, base = Pt + ih;
    var x = function (i) { return W - Pr - (i / 11) * iw; };   /* الشهر الأول على اليمين */
    var y = function (v) { return Pt + (1 - v) * ih; };
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;overflow:visible" role="img" aria-label="مسار السنة شهرًا بشهر"><defs>';
    KEYS.forEach(function (k) {
      out += '<linearGradient id="gr-' + k + '" x1="0" y1="0" x2="0" y2="1">' +
             '<stop offset="0" style="stop-color:' + SQ[k].c + ';stop-opacity:.22"></stop>' +
             '<stop offset="1" style="stop-color:' + SQ[k].c + ';stop-opacity:0"></stop></linearGradient>';
    });
    out += '</defs>';
    [0, 0.25, 0.5, 0.75, 1].forEach(function (g) {
      out += '<line x1="' + Pl + '" x2="' + (W - Pr) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="var(--track)" stroke-width="1"' + (g ? ' stroke-dasharray="3 5"' : '') + '></line>' +
             '<text x="' + (Pl - 8) + '" y="' + (y(g) + 4) + '" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="Readex Pro">' + Math.round(g * 100) + '%</text>';
    });
    for (var i = 0; i < 12; i++) {
      out += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Readex Pro">' + (i + 1) + '</text>';
    }
    KEYS.forEach(function (k) {
      var pts = [];
      months.forEach(function (m, i) { var v = monthScores(m)[k]; if (v !== null) pts.push({ x:x(i), y:y(v), v:v, i:i }); });
      if (!pts.length) return;
      var d = smoothPath(pts, Pt, base);
      out += '<path d="' + d + '" fill="none" stroke="' + SQ[k].c + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path>';
      pts.forEach(function (p) {
        out += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4" fill="var(--bg)" stroke="' + SQ[k].c + '" stroke-width="2"><title>' + MONTH_LABEL(p.i + 1) + ' — ' + SQ[k].short + ': ' + pct(p.v) + '</title></circle>';
      });
    });
    return out + '</svg>';
  }

  function deleteX(key, title) {

    }).join("") + '</div>';
  }
  function ringCenter(v, cap, fs) {

  function sqHead(sq, score) {

  /* ============ التنبيهات ============ */
  function notice(color, icon, html, btnLabel, actAttrs) {
    return '<div class="notice no-print fade" style="--c:' + color + '"><span class="n-ic">' + ic(icon, 18) + '</span>' +
      '<div class="n-tx">' + html + '</div>' +
      (btnLabel ? '<button class="btn" ' + actAttrs + '>' + btnLabel + '</button>' : '') + '</div>';
  }
  function notices(where) {
    var out = "", tp = todayPos();
    /* خانات لم تُسجَّل منذ آخر زيارة */
    if (tp) {
      var miss = missingFor(tp.mi);
      var onCur = where === tp.mi;
      if (miss > 0) {
        var gapTxt = (visitGap && visitGap > 0) ? 'آخر زيارة لك كانت قبل <span class="num">' + visitGap + '</span> ' + (visitGap === 1 ? "يوم" : visitGap === 2 ? "يومين" : (visitGap <= 10 ? "أيام" : "يومًا")) + '. ' : '';
        out += notice("var(--c-commit)", I.clock,
          '<b>' + gapTxt + (miss === 1 ? 'بقيت خانة التزام واحدة لم تُسجَّل' : miss === 2 ? 'بقيت خانتا التزام لم تُسجَّلا' : 'بقيت <span class="num">' + miss + '</span> ' + (miss <= 10 ? 'خانات' : 'خانة') + ' التزام لم تُسجَّل') + ' في الأيام الماضية.</b>' +
          '<small>' + (onCur ? 'الخانات المنقّطة بانتظارك، ويوم اليوم محاط بإطار.' : 'في ' + MONTH_LABEL(tp.mi + 1) + ' — ' + calLabel(tp.mi + 1) + '.') + '</small>',
          onCur ? "انتقل إلى الالتزام" : "افتح الشهر الحالي", 'data-act="today"');
      }
      /* شهر انتهى للتو: اقتراح مشاركة الحصاد */

        var po = monthOverall(monthScores(months[pm]));
        if (po !== null) out += notice("var(--c-growth)", I.spark,
          '<b>انتهى ' + MONTH_LABEL(pm + 1) + ' (' + calLabel(pm + 1) + ') بمحصلة <span class="num">' + pct(po) + '</span>.</b><small>شارك حصادك بصورة جاهزة بمقاس الستوري.</small>',

    }

    if (hasAnyData()) {

      if (since === null || since >= 14) out += notice("var(--c-tasks)", I.shield,
        '<b>' + (since === null ? 'لم تأخذ نسخة احتياطية من بياناتك بعد.' : 'مضى <span class="num">' + since + '</span> يومًا على آخر نسخة احتياطية.') + '</b>' +
        '<small>بياناتك محفوظة في هذا المتصفح فقط؛ احتفظ بنسخة في ملف كي لا تضيع.</small>',
        "نسخة احتياطية الآن", 'data-act="export"');

  }

  /* ============ قائمة الإعدادات ============ */
  var menuOpen = false;

  function canOfferInstall() { return IS_HOSTED && !IS_STANDALONE && !meta.installed; }
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); installEvt = e;

  });
  function menuHTML() {
    var st = startYM(), yNow = new Date().getFullYear(), resetOn = armed === "reset";
    var mOpts = AR_MONTHS.map(function (n, i) { return '<option value="' + (i + 1) + '"' + (st.m === i + 1 ? " selected" : "") + '>' + n + '</option>'; }).join("");
    var yOpts = "";

    function item(act, icon, t, sub, extra) {
      return '<button class="m-item' + (extra || "") + '" data-act="' + act + '"' + (act === "arm" || act === "confirm" ? ' data-key="reset"' : '') + '><span class="mi">' + ic(icon, 16) + '</span><span>' + t + (sub ? '<small>' + sub + '</small>' : '') + '</span></button>';
    }
    return '<div class="menu" role="menu">' +
      '<div class="m-sec"><div class="m-lbl">المظهر</div><div class="seg">' +
        '<button data-act="set-theme" data-v="dark" class="' + (theme === "dark" ? "on" : "") + '">داكن</button>' +
        '<button data-act="set-theme" data-v="light" class="' + (theme === "light" ? "on" : "") + '">فاتح</button></div></div>' +
      '<div class="m-sec"><div class="m-lbl">البيانات</div>' +
        item("export", I.down, "نسخة احتياطية" + (backupDue() ? '<span class="r-dot in"></span>' : ''), backupDue() ? '<span style="color:var(--danger)">' + (meta.lastBackup ? "مضى أسبوعان على آخر نسخة — خذ نسخة الآن" : "لم تأخذ نسخة بعد — خذ نسخة الآن") + '</span>' : "تنزيل ملف يحفظ بياناتك كلها") +
        item("import", I.up, "استعادة من ملف", "استرجاع بياناتك من نسخة سابقة") +
        item("pdf", I.print, "حفظ بصيغة PDF", "طباعة الصفحة الحالية أو حفظها") +
      '</div>' +
      '<div class="m-sec">' +
        item(resetOn ? "confirm" : "arm", I.reset, resetOn ? "هل أنت متأكد؟ اضغط مرة أخرى" : "تفريغ البيانات", resetOn ? "سيُمسح كل شيء نهائيًا" : "البدء من جديد بنموذج فارغ", " danger" + (resetOn ? " armed" : "")) +
      '</div>' +

      '<div class="m-foot' + (saveState === "err" ? " err" : "") + '"><span class="dot"></span><span>' +
        (saveState === "err" ? "تعذّر الحفظ في هذا المتصفح — خذ نسخة احتياطية الآن" : "محفوظ تلقائيًا على هذا الجهاز") + ' · ' + bk + '</span></div>' +
    '</div>';
  }

  /* ============ الترويسة ============ */
  function header(allScores) {
    var st = saveState === "busy" ? ["busy", "جارٍ الحفظ…"]
           : saveState === "err" ? ["err", "تعذّر الحفظ — احتفظ بنسخة احتياطية"]

    var tabs = '<button class="mtab year' + (view === "year" ? " on" : "") + '" data-act="view" data-v="year">السنة<span class="pip"></span></button>';
    for (var i = 0; i < 12; i++) {
      var o = monthOverall(allScores[i]);
      tabs += '<button class="mtab' + (view === i + 1 ? " on" : "") + (o !== null ? " has" : "") + '" data-act="view" data-v="' + (i + 1) + '" title="' + MONTH_LABEL(i + 1) + ' · ' + calLabel(i + 1) + ' — ' + pct(o) + '">' +
        '<span class="num">' + (i + 1) + '</span><span class="pip"><i style="width:' + ((o || 0) * 100) + '%;background:' + grade(o).c + '"></i></span></button>';

          '<div><h1>أتمّ</h1><div class="tag">التزام <b style="color:var(--c-commit)">·</b> تطور <b style="color:var(--c-growth)">·</b> مهام</div></div>' +

  /* ============ عرض السنة ============ */
  function yearView(allScores) {

    });

    var hasAny = allScores.some(function (s) { return monthOverall(s) !== null; });

      '<div class="ring-col">' + triRing(216, annual, ringCenter(overall, "المحصلة السنوية", 36)) + '</div>' +

          '<div class="row">' + badge(overall) + '<button class="ibtn share no-print" data-act="story" data-k="year">' + ic(I.share, 15) + '<span class="lbl">صورة للمشاركة</span></button></div></div>' +
        statRows(annual) +
        (hasAny ? '' : '<div class="empty-hero">النموذج جاهز. اختر شهرًا من الشريط العلوي، وابدأ بتعبئة مربعاتك الثلاثة.</div>') +
      '</div></section>';


    if (hasAny) {
      /* رؤى سريعة */
      var active = 0, best = null, bestI = -1;
      allScores.forEach(function (s, i) { var o = monthOverall(s); if (o !== null) { active++; if (best === null || o > best) { best = o; bestI = i; } } });
      var ranked = KEYS.filter(function (k) { return annual[k] !== null; }).sort(function (a, b) { return annual[b] - annual[a]; });
      var tiles = [
        { k:"الأشهر المفعّلة", v:'<span class="num">' + active + '</span> من <span class="num">12</span>', s:active === 12 ? "عام مكتمل" : "استمر في التعبئة" },
        { k:"أفضل شهر", v:MONTH_LABEL(bestI + 1), s:'<span class="num">' + pct(best) + '</span> — ' + grade(best).t }
      ];

      if (ranked.length > 1) { var w = ranked[ranked.length - 1]; tiles.push({ k:"المحور الأحوج إلى عناية", v:'<span style="color:' + SQ[w].c + '">' + SQ[w].short + '</span>', s:'<span class="num">' + pct(annual[w]) + '</span>' }); }
      out += '<section class="ins fade">' + tiles.map(function (t) {

        '<div class="legend">' + KEYS.map(function (k) { return '<span><i style="background:' + SQ[k].c + '"></i>' + SQ[k].short + '</span>'; }).join("") + '</div>' +
        '</div>' + trendChart() + '</section>';
    }

    out += '<section class="mgrid fade">';
    for (var i = 0; i < 12; i++) {
      var s = allScores[i], o = monthOverall(s), gg = grade(o);

  }

  /* ============ عرض الشهر ============ */
  function monthView(mi) {
    var m = months[mi], ms = monthScores(m), o = monthOverall(ms), g = grade(o);
    var daysOpts = [28, 29, 30, 31].map(function (d) { return '<option value="' + d + '"' + (m.days === d ? " selected" : "") + '>' + d + '</option>'; }).join("");

    var out = '<section class="card hero mhero fade">' +
      '<div class="ring-col">' + triRing(196, ms, ringCenter(o, "محصلة الشهر", 33)) + '</div>' +
      '<div class="side">' +
        '<div class="side-head"><div><div class="eyebrow">ملخص الشهر · ' + calLabel(m.month) + ' · <span class="num">' + m.days + '</span> يومًا</div><div class="ttl">' + MONTH_LABEL(m.month) + '</div></div>' +
          '<div class="row">' + (relOf(mi) === 0 ? '<span class="today-tag">' + ic(I.cal, 13) + 'الشهر الحالي</span>' : '') + badge(o) + '</div></div>' +

          '<button class="ibtn" data-act="next"' + (mi === 11 ? ' disabled style="opacity:.4;cursor:default"' : '') + '><span class="lbl">الشهر التالي</span>' + ic(I.left, 15) + '</button>' +
          '<button class="ibtn share" data-act="story" data-k="month" data-i="' + mi + '">' + ic(I.share, 15) + '<span class="lbl">صورة للمشاركة</span></button>' +

    /* مربع المهام */

      (m.tasks.length === 0 ? '<div class="empty">أضف مجالًا، ثم أدرج تحته مهام هذا الشهر.</div>' : '');

    m.tasks.forEach(function (d, di) {
      var ds = domainScore(d);
      var chips = d.items.map(function (it, ii) {

        var del = (armed === key)
          ? '<span class="confirm" data-act="confirm" data-key="' + key + '">تأكيد؟</span>'

        return '<div class="chip s' + s + '" data-act="cycle" data-di="' + di + '" data-ii="' + ii + '" role="button" tabindex="0" title="' + (s === 2 ? "تمّت" : s === 1 ? "أُنجزت جزئيًا" : "لم تُنجز") + '">' +
          '<span class="st">' + (s === 2 ? "✓" : "") + '</span><span class="tx">' + esc(it.n) + '</span>' + del + '</div>';
      }).join("");
      out += '<div class="item">' +

        (chips ? '<div class="chips">' + chips + '</div>' : '') +
        '<div class="row no-print"><input class="field" id="inp-task-' + di + '" data-enter="add-task" data-di="' + di + '" placeholder="أضف مهمة جديدة…" style="flex:1">' +
          '<button class="btn" data-act="add-task" data-di="' + di + '">إضافة</button></div>' +
      '</div>';
    });
    out += '<div class="adder no-print"><div class="adder-t">+ مجال جديد</div><div class="row">' +
      '<input class="field" id="inp-domain" data-enter="add-domain" placeholder="اسم المجال، مثل: العمل، الأسرة، الصحة" style="flex:1;min-width:180px">' +
      '<button class="btn" data-act="add-domain">إضافة</button></div></div>' +
      '</div></section>';

    /* مربع التطور */
    out += '<section class="card sq fade" style="--c:' + SQ.growth.c + '">' + sqHead(SQ.growth, ms.growth) + '<div class="sq-body">' +
      (m.growth.length === 0 ? '<div class="empty">أضف مهارة تريد أن تنمو فيها هذا الشهر، وحدّد وحدة القياس وعدد التكرارات، فتظهر خانات الإنجاز بعددها.</div>' : '');
    m.growth.forEach(function (r, ri) {
      var sc = rowScore(r), done = r.d.filter(function (v) { return v === 1; }).length;
      var grid = r.d.map(function (v, i) {
        return '<button class="g-cell' + (v === 1 ? " on" : "") + '" data-act="gtoggle" data-ri="' + ri + '" data-i="' + i + '" title="' + esc((r.unit || "تكرار") + " " + (i + 1)) + '"><span class="num">' + (v === 1 ? "✓" : (i + 1)) + '</span></button>';
      }).join("");
      out += '<div class="item"><div class="item-head">' +
          '<span class="item-name">' + esc(r.n) + '</span><span class="pill">' + esc(r.unit) + '</span><span class="spacer"></span>' +
          '<span class="hint"><span class="num">' + done + ' / ' + r.t + '</span> ' + esc(r.unit) + '</span>' +
          '<span class="pc-s num">' + pct(sc) + '</span>' + deleteX("g:" + ri, "حذف البند") +

    out += '<div class="adder no-print"><div class="adder-t">+ مهارة جديدة</div><div class="row">' +
      '<input class="field" id="g-name" data-enter="add-growth" placeholder="المهارة" style="flex:2;min-width:150px">' +
      '<input class="field" id="g-unit" data-enter="add-growth" placeholder="وحدة القياس (صفحة، جلسة…)" style="flex:1.5;min-width:150px">' +
      '<label class="lbl-in">عدد التكرارات <input class="field n" id="g-count" data-enter="add-growth" type="number" min="1" max="99" value="10"></label>' +
      '<button class="btn" data-act="add-growth">إضافة</button></div></div>' +
      '</div></section>';

    /* مربع الالتزام */
    var rel = relOf(mi), dayIdx = rel === 0 ? new Date().getDate() - 1 : -1;
    out += '<section class="card sq fade" id="sec-commit" style="--c:' + SQ.commit.c + '">' + sqHead(SQ.commit, ms.commit) + '<div class="sq-body">' +
      (m.commit.length === 0
        ? '<div class="empty">أضف التزامًا وحدّد عدد الأيام المستهدفة هذا الشهر، فتظهر خانات بعدد أيام الشهر (<span class="num">' + m.days + '</span> يومًا) لتعليم كل يوم.</div>'
        : '<div class="keys"><span><i style="background:var(--c-commit);border-color:var(--c-commit)"></i>التزمت</span><span><i style="background:color-mix(in srgb,var(--danger) 14%,transparent);border-color:color-mix(in srgb,var(--danger) 45%,transparent)"></i>لم ألتزم</span><span><i style="background:var(--field)"></i>لم يُسجَّل</span>' +
          (rel === 0 ? '<span><i class="k-today" style="background:var(--field)"></i>اليوم</span>' : '') +
          '<span>— اضغط الخانة للتبديل</span></div>');
    m.commit.forEach(function (r, ri) {
      var sc = rowScore(r), done = r.d.filter(function (v) { return v === 1; }).length;
      var grid = r.d.map(function (v, i) {
        var cls = v === 1 ? " on" : v === 0 ? " off" : "";
        if (i === dayIdx) cls += " today";
        return '<button class="c-cell' + cls + '" data-act="ctoggle" data-ri="' + ri + '" data-i="' + i + '" title="' + (i === dayIdx ? "اليوم — " : "") + 'يوم ' + (i + 1) + ' من ' + calLabel(m.month) + '"><span class="num">' + (i + 1) + '</span></button>';
      }).join("");
      out += '<div class="item"><div class="item-head">' +
          '<span class="item-name" style="flex:1;min-width:120px">' + esc(r.n) + '</span>' +
          '<span class="hint"><span class="num">' + done + '</span> يومًا من هدف ' +
            '<input class="tgt num" data-act="target" data-ri="' + ri + '" data-nr="1" type="number" min="1" max="' + m.days + '" value="' + r.t + '"> يومًا</span>' +
          '<span class="pc-s num">' + pct(sc) + '</span>' + deleteX("c:" + ri, "حذف الالتزام") +
        '</div><div class="c-grid">' + grid + '</div>' + bar(sc, SQ.commit.c, 5) + '</div>';
    });
    out += '<div class="adder no-print"><div class="adder-t">+ التزام جديد</div><div class="row">' +
      '<input class="field" id="c-name" data-enter="add-commit" placeholder="الالتزام، مثل: المشي نصف ساعة" style="flex:2;min-width:180px">' +
      '<label class="lbl-in">الأيام المستهدفة <input class="field n" id="c-target" data-enter="add-commit" type="number" min="1" max="' + m.days + '" value="' + m.days + '"></label>' +
      '<button class="btn" data-act="add-commit">إضافة</button></div></div>' +
      '</div></section>';

    return out;
  }

  var app = document.getElementById("app");

  function render() {
    /* ساعة مشتركة تجعل الحركة تستمر بسلاسة ولا تبدأ من الصفر بعد كل نقرة */
    document.documentElement.style.setProperty("--t", (-(performance.now() / 1000)).toFixed(3) + "s");
    var snap = {}, focusId = null, caret = null, sy = window.scrollY;
    var navEl = app.querySelector(".months"), navX = navEl ? navEl.scrollLeft : null;
    app.querySelectorAll("input[id]").forEach(function (el) { if (!el.dataset.nr) snap[el.id] = el.value; });
    var ae = document.activeElement;
    if (ae && ae.id && app.contains(ae)) { focusId = ae.id; try { caret = ae.selectionStart; } catch (e) {} }

    var allScores = months.map(monthScores);
    app.innerHTML = header(allScores) +
      '<main class="shell">' + (view === "year" ? yearView(allScores) : monthView(view - 1)) + '</main>' +
      '<footer><div class="by">إعداد وتصميم</div><div class="nm">م. إياد حلوبي</div>' +
      '<div class="note">أتمّ — التزام · تطور · مهام · تُحفظ البيانات تلقائيًا على هذا الجهاز</div></footer>';

    if (!animateNext) app.querySelectorAll(".fade").forEach(function (el) { el.classList.remove("fade"); });
    animateNext = false;

    app.querySelectorAll("input[id]").forEach(function (el) { if (!el.dataset.nr && snap[el.id] !== undefined) el.value = snap[el.id]; });
    if (focusId) { var f = document.getElementById(focusId); if (f) { f.focus(); try { if (caret !== null) f.setSelectionRange(caret, caret); } catch (e) {} } }
    var nav = app.querySelector(".months");
    if (nav && navX !== null) nav.scrollLeft = navX;
    window.scrollTo(0, sy);
  }

  /* ============ الأفعال ============ */
  function val(id) { var el = document.getElementById(id); return el ? el.value : ""; }
  function clear(id) { var el = document.getElementById(id); if (el) el.value = ""; }

  function setMonthDays(mi, days) {
    var mm = months[mi];
    mm.days = days;
    mm.commit.forEach(function (r) {
      while (r.d.length < days) r.d.push(null);
      if (r.d.length > days) r.d = r.d.slice(0, days);
      if (r.t > days) r.t = days;
    });
  }

  function doConfirm(key) {
    var mi = view - 1, p = key.split(":");
    if (key === "reset") { months = EMPTY(); for (var i = 0; i < 12; i++) months[i].days = daysInCal(i + 1); view = "year"; animateNext = true; menuOpen = false; }
    else if (p[0] === "t") months[mi].tasks[+p[1]].items.splice(+p[2], 1);
    else if (p[0] === "d") months[mi].tasks.splice(+p[1], 1);
    else if (p[0] === "g") months[mi].growth.splice(+p[1], 1);
    else if (p[0] === "c") months[mi].commit.splice(+p[1], 1);
    disarm();
    save();
  }

  function go(v) {
    disarm();
    view = v;
    animateNext = true;
    window.scrollTo(0, 0);
    render();
    var on = app.querySelector(".mtab.on");
    if (on && on.scrollIntoView) on.scrollIntoView({ block:"nearest", inline:"center" });
  }

  function act(a, ds) {
    var mi = view - 1;
    switch (a) {
      case "view": go(ds.v === "year" ? "year" : +ds.v); return;
      case "prev": if (mi > 0) go(mi); return;
      case "next": if (mi < 11) go(mi + 2); return;
      case "menu": menuOpen = !menuOpen; disarm(); render(); return;
      case "install":
        menuOpen = false; render();
        openInstall();
        return;
      case "set-theme":
        theme = ds.v; applyTheme(theme);
        try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
        render(); return;
      case "theme":
        theme = theme === "dark" ? "light" : "dark";
        applyTheme(theme);
        try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
        render(); return;
      case "pdf": menuOpen = false; render(); setTimeout(function () { window.print(); }, 80); return;
      case "today": {
        menuOpen = false;
        var tp = todayPos();
        if (!tp) return;
        if (view !== tp.mi + 1) go(tp.mi + 1);
        setTimeout(function () {
          var sec = document.getElementById("sec-commit"), t = sec && sec.querySelector(".c-cell.today");
          if (sec) sec.scrollIntoView({ behavior:"smooth", block:"start" });
          if (t) setTimeout(function () { t.focus({ preventScroll:true }); }, 450);
        }, 60);
        return;
      }
      case "story": menuOpen = false; openStory(ds.k, ds.k === "month" ? +ds.i : null); return;
      case "export": menuOpen = false; exportJSON(); return;
      case "import": menuOpen = false; render(); document.getElementById("importFile").click(); return;
      case "arm": armKey(ds.key); return;
      case "confirm": doConfirm(ds.key); return;
      case "cycle": {
        var it = months[mi].tasks[+ds.di].items[+ds.ii];
        it.s = !it.s ? 1 : it.s === 1 ? 2 : 0;
        save(); return;
      }
      case "gtoggle": {
        var g = months[mi].growth[+ds.ri];
        g.d[+ds.i] = g.d[+ds.i] === 1 ? null : 1;
        save(); return;
      }
      case "ctoggle": {
        var c = months[mi].commit[+ds.ri], cur = c.d[+ds.i];
        c.d[+ds.i] = cur === 1 ? 0 : cur === 0 ? null : 1;
        save(); return;
      }
      case "add-domain": {
        var nd = val("inp-domain").trim();
        if (!nd) return;
        months[mi].tasks.push({ domain:nd, items:[] });
        clear("inp-domain"); save(); return;
      }
      case "add-task": {
        var nt = val("inp-task-" + ds.di).trim();
        if (!nt) return;
        months[mi].tasks[+ds.di].items.push({ n:nt, s:0 });
        clear("inp-task-" + ds.di); save(); return;
      }
      case "add-growth": {
        var gn = val("g-name").trim(), gu = val("g-unit").trim(), gc = parseInt(val("g-count"), 10);
        if (!gn || !gu || !gc) return;
        gc = Math.max(1, Math.min(99, gc));
        months[mi].growth.push({ n:gn, unit:gu, t:gc, d:new Array(gc).fill(null) });
        clear("g-name"); clear("g-unit");
        var gcEl = document.getElementById("g-count"); if (gcEl) gcEl.value = 10;
        save(); return;
      }
      case "add-commit": {
        var cn = val("c-name").trim(), ct = parseInt(val("c-target"), 10);
        if (!cn || !ct) return;
        var days = months[mi].days;
        months[mi].commit.push({ n:cn, t:Math.max(1, Math.min(days, ct)), d:new Array(days).fill(null) });
        clear("c-name");
        var ctEl = document.getElementById("c-target"); if (ctEl) ctEl.value = days;
        save(); return;
      }
    }
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t || t.disabled) return;
    if (t.tagName === "INPUT" || t.tagName === "SELECT") return;
    e.preventDefault();
    e.stopPropagation();
    act(t.dataset.act, t.dataset);
  });

  document.addEventListener("click", function (e) {
    if (menuOpen && !e.target.closest(".menu-wrap")) { menuOpen = false; disarm(); render(); }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && menuOpen) { menuOpen = false; render(); } });

  app.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset.act === "days") { setMonthDays(view - 1, +t.value); save(); }
    else if (t.dataset.act === "target") {
      var mi = view - 1, days = months[mi].days;
      months[mi].commit[+t.dataset.ri].t = Math.max(1, Math.min(days, parseInt(t.value, 10) || 1));
      save();
    }
  });

  app.addEventListener("keydown", function (e) {
    var t = e.target;
    if (e.key === "Enter" && t.tagName === "INPUT" && t.dataset.enter) { e.preventDefault(); act(t.dataset.enter, t.dataset); return; }
    if ((e.key === "Enter" || e.key === " ") && t.classList && t.classList.contains("chip")) { e.preventDefault(); act("cycle", t.dataset); }
  });

  /* ============ صورة الستوري للمشاركة ============ */
  var PAL = {
    dark:  { bg:"#0C1222", bg2:"#0A0F1C", card:"#151E33", ink:"#EDE8DE", muted:"#8B93A7", track:"rgba(255,255,255,0.08)", line:"rgba(255,255,255,0.08)",
             tasks:"#6E9BF0", growth:"#5CC79A", commit:"#E9B65A", warn:"#DD8A55", danger:"#E8776F", glow:0.22 },
    light: { bg:"#EEF1F5", bg2:"#E3E7EE", card:"#FFFFFF", ink:"#1C2333", muted:"#6E7689", track:"rgba(20,30,55,0.08)", line:"rgba(20,30,55,0.10)",
             tasks:"#3462D2", growth:"#1E8C60", commit:"#B97E12", warn:"#C9733A", danger:"#CC4F47", glow:0.12 }
  };
  function gradeColor(v, P) {
    if (v === null || v === undefined) return P.muted;
    return v >= 0.9 ? P.growth : v >= 0.8 ? P.tasks : v >= 0.6 ? P.commit : v >= 0.4 ? P.warn : P.danger;
  }
  function hexA(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")";
  }
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function txt(ctx, s, x, y, font, color, align, dir) {
    ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align || "center";
    ctx.direction = dir || "rtl"; ctx.textBaseline = "middle";
    ctx.fillText(s, x, y);
  }
  /* يصغّر الخط حتى يتّسع النص في العرض المتاح */
  function fitFont(ctx, s, weight, size, family, maxW) {
    ctx.font = weight + " " + size + "px " + family;
    while (size > 10 && ctx.measureText(s).width > maxW) { size -= 2; ctx.font = weight + " " + size + "px " + family; }
    return weight + " " + size + "px " + family;
  }
  var DISPLAY = '"Readex Pro", "IBM Plex Sans Arabic", sans-serif';
  var BODY = '"IBM Plex Sans Arabic", "Readex Pro", sans-serif';

  function storyData(kind, idx) {
    if (kind === "month") {
      var m = months[idx], sc = monthScores(m), done = 0, total = 0, reps = 0, streak = 0;
      m.tasks.forEach(function (d) { d.items.forEach(function (it) { if (it.n && it.n.trim()) { total++; if (it.s === 2) done++; } }); });
      m.growth.forEach(function (r) { reps += r.d.filter(function (v) { return v === 1; }).length; });
      m.commit.forEach(function (r) { streak = Math.max(streak, longestStreak(r)); });
      return {
        kind: "month", title: "حصاد " + calLabel(idx + 1), cap: "محصلة الشهر", sc: sc,
        stats: [
          { v: done + " من " + total, l: "مهام أُنجزت" },
          { v: String(reps), l: "تكرارات تطوّر", ltr: true },
          { v: streak + " " + (streak >= 3 && streak <= 10 ? "أيام" : "يومًا"), l: "أطول سلسلة التزام" }
        ],
        file: "atamm-" + calOf(idx + 1).y + "-" + pad(calOf(idx + 1).m) + ".png"
      };
    }
    var all = months.map(monthScores), annual = {}, active = 0, best = null, bestI = 0, streakY = 0;
    KEYS.forEach(function (k) { annual[k] = avg(all.map(function (x) { return x[k]; }).filter(function (v) { return v !== null; })); });
    all.forEach(function (x, i) { var o = monthOverall(x); if (o !== null) { active++; if (best === null || o > best) { best = o; bestI = i; } } });
    months.forEach(function (m) { m.commit.forEach(function (r) { streakY = Math.max(streakY, longestStreak(r)); }); });
    var y1 = calOf(1).y, y2 = calOf(12).y;
    return {
      kind: "year", ms: all, mlabels: all.map(function (x, i) { return AR_MONTHS[calOf(i + 1).m - 1]; }),
      title: "حصاد عام " + (y1 === y2 ? y1 : y1 + " — " + y2), cap: "المحصلة السنوية", sc: annual,
      stats: [
        { v: active + " من 12", l: "أشهر مفعّلة" },
        { v: best === null ? "—" : MONTH_LABEL(bestI + 1), l: "أفضل شهر" },
        { v: streakY + " " + (streakY >= 3 && streakY <= 10 ? "أيام" : "يومًا"), l: "أطول سلسلة التزام" }
      ],
      file: "atamm-year-" + y1 + ".png"
    };
  }

  function arcRing(ctx, cx, cy, r, sw, v, color, track, glow) {
    ctx.lineWidth = sw; ctx.lineCap = "round";
    ctx.strokeStyle = track; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    v = (v === null || v === undefined) ? 0 : clamp01(v);
    if (v <= 0) return;
    ctx.save();

      '<p>يفتح من شاشة جهازك مباشرة كأي تطبيق، بشاشة كاملة، ويعمل حتى دون إنترنت.</p>' +
      how +
      '<button class="skip" data-i="skip">' + (installEvt || !IS_IOS ? "تخطٍّ" : "حسنًا") + '</button>' +
      '<div class="hint">يمكنك تثبيته لاحقًا من القائمة (⋯) في الأعلى.</div></div>';
  }
  function openInstall() {
    if (!canOfferInstall()) return;
    inst.innerHTML = installBody();
    inst.classList.add("open");
  }
  function closeInstall() { inst.classList.remove("open"); }
  inst.addEventListener("click", function (e) {
    var b = e.target.closest("[data-i]");
    if (e.target === inst || (b && b.dataset.i === "skip")) {
      meta.installSkipped = true; saveMeta(); closeInstall(); render(); return;
    }
    if (b && b.dataset.i === "go" && installEvt) {
      var ev = installEvt;
      ev.prompt();
      ev.userChoice.then(function (r) {
        installEvt = null;
        if (r && r.outcome === "accepted") { meta.installed = true; } else { meta.installSkipped = true; }
        saveMeta(); closeInstall(); render();
      });
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && inst.classList.contains("open")) { meta.installSkipped = true; saveMeta(); closeInstall(); } });
  /* على iPhone لا يوجد تثبيت تلقائي: تظهر الخطوات مرة واحدة عند أول فتح */
  if (IS_IOS && !meta.installSkipped && canOfferInstall()) setTimeout(openInstall, 1200);

  /* ============ النسخ الاحتياطي ============ */
  function exportJSON() {
    var payload = { app:"atamm", v:1, savedAt:new Date().toISOString(), months:months };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "atamm-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    meta.lastBackup = TODAY;
    saveMeta();
    render();
  }

  document.getElementById("importFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var j = JSON.parse(r.result);
        var arr = Array.isArray(j) ? j : j && j.months;
        if (!Array.isArray(arr)) throw new Error("bad");
        if (!window.confirm("ستُستبدل بياناتك الحالية كلها بمحتوى هذا الملف. هل تريد المتابعة؟")) return;
        months = migrate(arr);
        view = "year"; animateNext = true;
        save();
      } catch (err) {
        window.alert("الملف غير صالح. تأكّد أنه ملف نسخة احتياطية من «أتمّ».");
      }
    };
    r.readAsText(f);
    e.target.value = "";
  });

  window.addEventListener("beforeunload", function (e) {
    if (saveState === "err") { e.preventDefault(); e.returnValue = ""; }
  });

  months = load();
  (function () {
    var changed = false;
    for (var i = 0; i < 12; i++) { var d = daysInCal(i + 1); if (months[i].days !== d) { setMonthDays(i, d); changed = true; } }
    if (changed) { try { localStorage.setItem(STORE_KEY, JSON.stringify(months)); } catch (e) {} }
  })();
  (function () { var tp = todayPos(); if (tp) view = tp.mi + 1; })();
  if (meta.start) { delete meta.start; saveMeta(); }
  render();
})();
</script>
<script>
/* تسجيل عامل الخدمة ليعمل التطبيق دون إنترنت بعد أول زيارة */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
